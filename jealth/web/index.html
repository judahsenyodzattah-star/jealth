<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.
    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="J'ealth - AI-Powered Heart Disease Classification. An educational machine learning demonstration, not a medical diagnostic tool.">
  <meta name="theme-color" content="#146C94">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="J'ealth">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>J'ealth - AI-Powered Heart Disease Classification</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Launch screen shown until Flutter paints its first frame. */
    html, body { height: 100%; margin: 0; background: #F5F8FC; }
    @media (prefers-color-scheme: dark) { html, body { background: #0D1626; } }
    #jealth-launch {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #172B4D; transition: opacity .25s ease;
    }
    @media (prefers-color-scheme: dark) { #jealth-launch { color: #E6EDF7; } }
    #jealth-launch img { width: 96px; height: 96px; }
    #jealth-launch .name { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; }
    #jealth-launch .sub { font-size: 14px; opacity: .72; margin-top: -10px; }
    #jealth-launch .bar { width: 120px; height: 4px; border-radius: 4px; background: rgba(20,108,148,.18); overflow: hidden; }
    #jealth-launch .bar::after {
      content: ""; display: block; width: 40%; height: 100%; border-radius: 4px;
      background: linear-gradient(90deg, #146C94, #16A6A1);
      animation: jealth-slide 1.1s ease-in-out infinite;
    }
    @keyframes jealth-slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) { #jealth-launch .bar::after { animation: none; width: 100%; } }
  </style>
</head>
<body>
  <div id="jealth-launch" role="status" aria-label="Loading J'ealth">
    <img src="icons/Icon-192.png" alt="">
    <div class="name">J'ealth</div>
    <div class="sub">AI-Powered Heart Disease Classification</div>
    <div class="bar"></div>
  </div>
  <script>
    // Remove the launch screen once Flutter has rendered its first frame.
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('jealth-launch');
      if (!el) return;
      el.style.opacity = '0';
      setTimeout(function () { el.remove(); }, 260);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
